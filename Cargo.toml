[package]
name = "pomodoro"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20.0", default-features = false }
objc = "0.2"

# Top bar indicator. Build deps: libgtk-3-dev, libayatana-appindicator3-dev.
# libxdo is left out (only needed for muda accelerators, which we don't use).
[target.'cfg(target_os = "linux")'.dependencies]
muda = { version = "0.20.0", default-features = false, features = ["gtk3"] }
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"] }
gtk = "0.18"

[profile.release]
opt-level = 3
lto = true
strip = true
